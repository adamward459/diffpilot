[build]
# One build dir per worktree: a shared dir makes worktrees overwrite each other's workspace crates.
build-dir = "{cargo-cache-home}/build/diffpilot-{workspace-path-hash}"
[unstable]
# A file with the same content in another worktree stays fresh, even though its mtime is newer.
checksum-freshness = true

[alias]
xtask = "run -q -p xtask --"

[profile.dev.package."*"]
debug = false

[profile.dev]
# macOS defaults to "unpacked", where rustc keeps the object files of every rebuild of a crate (~100 MB per rebuild of the app).
split-debuginfo = "off"
