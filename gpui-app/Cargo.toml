[package]
name = "diffpilot"
version = "0.1.0"
edition = "2024"

[dependencies]
async-channel = "2"
diffpilot-core = { version = "0.1.0", path = "../core" }
diffpilot-ui-kit = { version = "0.1.0", path = "../ui-kit" }
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
gpui-component = "=0.5.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
similar = { version = "2", features = ["unicode"] }
syntect = { version = "5", default-features = false, features = ["parsing", "regex-onig"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-onig"] }
tempfile = { version = "3", optional = true }
unicode-width = "0.2"
pulldown-cmark = { version = "0.13.6", default-features = false }

[features]
testing = ["gpui/test-support", "dep:tempfile"]

[dev-dependencies]
diffpilot = { path = ".", features = ["testing"] }
gpui = { version = "0.2.2", features = ["runtime_shaders", "test-support"] }
serde_json = "1"
tempfile = "3"
