[package]
name = "diffpilot"
version = "0.1.0"
edition = "2024"

[dependencies]
async-channel = "2"
diffpilot-core = { version = "0.1.0", path = "../core" }
diffpilot-diff-pane = { version = "0.1.0", path = "../diff-pane" }
diffpilot-review-ui = { version = "0.1.0", path = "../review-ui" }
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
gpui-component = "=0.5.1"

[dev-dependencies]
gpui = { version = "0.2.2", features = ["runtime_shaders", "test-support"] }
tempfile = "3"
