name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: macos-15
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ~/.cargo/build is the build dir set in .cargo/config.toml. Every release changes Cargo.lock,
      # so the exact key misses and restore-keys picks the newest cache for the same toolchain.
      - name: Cache the Cargo downloads and build dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/build
          key: release-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            release-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Install the toolchain and both macOS targets
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # The release commit goes on top of the tagged commit and is pushed to main, so main must not have moved.
      - name: Check the tag is the tip of main
        run: |
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG must point at the tip of main. Pull, tag the latest main, and push the tag again."
            exit 1
          fi

      - name: Move the Unreleased notes into the version and commit
        run: |
          version="${TAG#v}"
          cargo xtask release "$version"
          cargo xtask release-notes "$version" > "$RUNNER_TEMP/notes.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): $TAG"
          git tag -f -a "$TAG" -m "diffpilot $TAG"

      - name: Build the universal app
        id: bundle
        run: |
          zip="$(cargo xtask bundle --universal --zip | tail -1)"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      # A push made with the workflow's own token does not start this workflow again.
      - name: Push the release commit and move the tag onto it
        id: push
        run: git push --atomic origin HEAD:main "+refs/tags/$TAG"

      - name: Publish the GitHub release
        run: gh release create "$TAG" "${{ steps.bundle.outputs.zip }}" --verify-tag --notes-file "$RUNNER_TEMP/notes.md" --title "diffpilot $TAG"

      # Frees the tag name while main is untouched, so pushing the same tag again retries the release.
      - name: Delete the tag if the release failed before main was updated
        if: failure() && steps.push.outcome != 'success'
        run: git push origin ":refs/tags/$TAG"
