name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: macos-15
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ~/.cargo/build is the build dir set in .cargo/config.toml. Every release changes Cargo.lock,
      # so the exact key misses and restore-keys picks the newest cache for the same toolchain.
      - name: Cache the Cargo downloads and build dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/build
          key: release-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            release-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Install the toolchain and both macOS targets
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Check the tag is on main and matches the app version
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG is not on main"
            exit 1
          fi
          version="$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "diffpilot") | .version')"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::$TAG does not match the diffpilot version $version in gpui-app/Cargo.toml. Run cargo xtask release."
            exit 1
          fi

      - name: Read the release notes
        run: cargo xtask release-notes "$TAG" > "$RUNNER_TEMP/notes.md"

      - name: Build the universal app
        id: bundle
        run: |
          zip="$(cargo xtask bundle --universal --zip | tail -1)"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" "${{ steps.bundle.outputs.zip }}" --verify-tag --notes-file "$RUNNER_TEMP/notes.md" --title "diffpilot $TAG"
