name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, like 0.2.0 (no leading v)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release

defaults:
  run:
    shell: bash

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain and both macOS targets
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Check the tag is new
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi

      - name: Move the Unreleased notes into the version and commit
        run: |
          cargo xtask release "$VERSION"
          cargo xtask release-notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v$VERSION"
          git tag "v$VERSION"

      - name: Build the universal app
        id: bundle
        run: |
          zip="$(cargo xtask bundle --universal --zip | tail -1)"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - name: Push the release commit and tag
        run: git push --atomic origin HEAD:main "v$VERSION"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" "${{ steps.bundle.outputs.zip }}" --verify-tag --notes-file "$RUNNER_TEMP/notes.md" --title "diffpilot v$VERSION"
